name: Build release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

env:
  TAG: ${{ github.event.release.tag_name || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set version and URLs in module.json
        run: |
          VERSION="${TAG#v}"
          REPO="${{ github.repository }}"
          jq --arg v "$VERSION" \
             --arg url "https://github.com/$REPO" \
             --arg manifest "https://github.com/$REPO/releases/latest/download/module.json" \
             --arg download "https://github.com/$REPO/releases/download/$TAG/module.zip" \
             '.version=$v | .url=$url | .manifest=$manifest | .download=$download' \
             module.json > module.tmp && mv module.tmp module.json

      - name: Zip module
        run: zip -r module.zip module.json scripts/ styles/ README.md LICENSE

      - name: Upload release assets
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.TAG }}
          name: ${{ env.TAG }}
          allowUpdates: true
          omitBodyDuringUpdate: true
          body: "Install in Foundry with the manifest URL: https://github.com/${{ github.repository }}/releases/latest/download/module.json"
          artifacts: "module.json, module.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
